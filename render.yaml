# SupplyPilot Render Deployment Infrastructure as Code (IaC)
# Single Unified Web Service serving both API backend and web UI.
# See https://render.com/docs/yaml-spec for details.

services:
  - type: web
    name: supplypilot-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
